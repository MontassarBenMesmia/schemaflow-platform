spring:
  application:
    name: schemaflow-api
  profiles:
    default: demo
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 1h
          cache-public: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /api/docs
  api-docs:
    path: /api/openapi

schemaflow:
  clickhouse:
    url: ${CLICKHOUSE_URL:http://localhost:8123}
    username: ${CLICKHOUSE_USER:default}
    password: ${CLICKHOUSE_PASSWORD:}
